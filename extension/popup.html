<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wishlist</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <span class="brand">Wishlist<i aria-hidden="true"></i></span>
    <button type="button" class="link" id="openList">Open my list</button>
  </header>

  <main id="view">
    <section class="state" id="scanning">
      <span class="spinner"></span>
      <p>Scanning this page for the product, price and photo…</p>
    </section>
  </main>

  <details class="settings" id="settings">
    <summary>App address</summary>
    <form id="serverForm">
      <input id="server" type="url" spellcheck="false" aria-label="Wishlist app address">
      <button type="submit">Save</button>
    </form>
  </details>

  <script src="popup.js"></script>
</body>
</html>
