<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wishlist</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <span class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 8h15l7 8-7 8H5z"/><circle cx="10" cy="16" r="2.2"/></svg>
      Wishlist
    </span>
    <button type="button" class="link" id="openList">Open my list</button>
  </header>

  <main id="view">
    <section class="state" id="scanning">
      <span class="spinner"></span>
      <p>Scanning this page for the product, price and photo…</p>
    </section>
  </main>

  <details class="settings" id="settings">
    <summary>App address</summary>
    <form id="serverForm">
      <input id="server" type="url" spellcheck="false" aria-label="Wishlist app address">
      <button type="submit">Save</button>
    </form>
  </details>

  <script src="popup.js"></script>
</body>
</html>
